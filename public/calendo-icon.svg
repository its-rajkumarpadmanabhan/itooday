<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED5B3"/>
      <stop offset="100%" stop-color="#D9AC7B"/>
    </linearGradient>

    <!-- Calendar Red Header Gradient -->
    <linearGradient id="redHeaderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5A5F"/>
      <stop offset="100%" stop-color="#E84146"/>
    </linearGradient>

    <!-- Calendar Cream Body Gradient -->
    <linearGradient id="creamBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F5EFE6"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#8C5E32" flood-opacity="0.28"/>
    </filter>

    <filter id="innerClipShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- Clip path for calendar page -->
    <clipPath id="calendarClip">
      <rect x="100" y="80" width="312" height="340" rx="60" ry="60"/>
    </clipPath>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#bgGrad)"/>

  <!-- Long diagonal shadow effect -->
  <path d="M 230 420 L 360 488 L 476 488 L 488 476 L 488 330 L 412 180 Z" fill="#C49360" opacity="0.4"/>

  <!-- Calendar Page Shadow & Base -->
  <g filter="url(#softShadow)">
    <rect x="100" y="80" width="312" height="340" rx="60" ry="60" fill="url(#creamBodyGrad)"/>
  </g>

  <!-- Clipped Calendar Elements -->
  <g clip-path="url(#calendarClip)">
    <!-- Red Top Header -->
    <rect x="100" y="80" width="312" height="96" fill="url(#redHeaderGrad)"/>
    <!-- Subtle divider line below red header -->
    <rect x="100" y="174" width="312" height="3" fill="#E2D7C7" opacity="0.6"/>

    <!-- Gift Box Icon in Cyan/Sky Blue -->
    <g stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Ribbon Bow Loops -->
      <!-- Left Bow Loop -->
      <path d="M 256 226 C 240 200 206 195 204 216 C 202 232 232 236 256 236 Z" fill="none" stroke-width="11"/>
      <!-- Right Bow Loop -->
      <path d="M 256 226 C 272 200 306 195 308 216 C 310 232 280 236 256 236 Z" fill="none" stroke-width="11"/>
      <!-- Center Knot -->
      <circle cx="256" cy="236" r="3" fill="#38BDF8" stroke="none"/>

      <!-- Gift Box Lid -->
      <rect x="194" y="238" width="124" height="28" rx="4" ry="4" stroke-width="11"/>

      <!-- Gift Box Body -->
      <rect x="204" y="266" width="104" height="82" rx="4" ry="4" stroke-width="11"/>

      <!-- Vertical Ribbon Line -->
      <line x1="256" y1="238" x2="256" y2="348" stroke-width="11"/>
    </g>
  </g>

  <!-- Top Binding Holes & Golden Strap Bar -->
  <g>
    <!-- Left Ring Hole -->
    <circle cx="180" cy="128" r="14" fill="#6A1315" opacity="0.85"/>
    <!-- Right Ring Hole -->
    <circle cx="332" cy="128" r="14" fill="#6A1315" opacity="0.85"/>

    <!-- Golden Strap Loop through both holes -->
    <rect x="168" y="120" width="176" height="16" rx="8" ry="8" fill="#FFF8DE" stroke="#D1BE8C" stroke-width="2.5"/>
    <rect x="174" y="123" width="164" height="4" rx="2" ry="2" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
